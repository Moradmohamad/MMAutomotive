<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — MM Automotive</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;600;900&family=Barlow:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #000000;
      --white: #f2f2f2;
      --grey: #888;
      --border: rgba(255,255,255,0.1);
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.6rem 3rem;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      text-decoration: none;
    }

    .logo-img { height: 52px; width: auto; mix-blend-mode: screen; filter: brightness(1.05); }

    .btn {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 0.6rem 1.4rem;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      cursor: pointer;
      border: none;
      display: inline-block;
    }

    .btn-outline {
      color: var(--white);
      background: transparent;
      border: 1px solid var(--border);
    }
    .btn-outline:hover { border-color: var(--white); }

    /* ── CONTACT PAGE ── */
    .contact-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10rem 3rem 5rem;
      max-width: 700px;
      margin: 0 auto;
      width: 100%;
    }

    .contact-eyebrow {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--grey);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .contact-eyebrow::before {
      content: '';
      display: inline-block;
      width: 22px;
      height: 1px;
      background: var(--grey);
    }

    h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: clamp(4rem, 10vw, 8rem);
      text-transform: uppercase;
      line-height: 0.88;
      letter-spacing: -0.01em;
      margin-bottom: 3.5rem;
    }

    h1 .outline {
      -webkit-text-stroke: 1.5px var(--white);
      color: transparent;
    }

    .contact-list {
      list-style: none;
      border-top: 1px solid var(--border);
    }

    .contact-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    .clabel {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--grey);
    }

    .cval {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.04em;
      color: var(--white);
      text-decoration: none;
      transition: color 0.2s;
    }
    a.cval:hover { color: #aaa; }

    /* ── FOOTER ── */
    footer {
      padding: 1.5rem 3rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    footer span {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--grey);
    }

    @media (max-width: 768px) {
      nav { padding: 1.2rem 1.5rem; }
      .contact-page { padding: 8rem 1.5rem 4rem; }
      footer { padding: 1.5rem; flex-direction: column; gap: 0.5rem; text-align: center; }
    }
  </style>
</head>
